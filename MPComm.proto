syntax = "proto3";

package mpcomm;

service GroupManager {
  rpc Register (PeerAddress) returns (Empty) {}
  rpc ListPeers (Empty) returns (PeerList) {}
  rpc Stop (Empty) returns (Empty) {}
}

service ComparisonServer {
  rpc SendLog (MessageLog) returns (Empty) {}
}

service Peer {
  rpc Start (StartRequest) returns (StartReply) {}
}

message Empty {}

message PeerAddress {
  string ip_address = 1;
  int32 port = 2;
}

message PeerList {
  repeated string ip_addresses = 1;
}

message StartRequest {
  int32 peer_id = 1;
  int32 num_messages = 2;
}

message StartReply {
  string status = 1;
}

message LoggedMessage {
  int32 sender = 1;
  int32 number = 2;
}

message MessageLog {
  int32 peer_id = 1;
  repeated LoggedMessage messages = 2;
}
